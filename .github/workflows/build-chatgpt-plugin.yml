name: Build ChatGPT Plugin

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "chatgpt-plugin/**"
      - "scripts/build_chatgpt_plugin.py"
      - ".github/workflows/build-chatgpt-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: Package plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Build and validate plugin archive
        run: |
          python3 scripts/build_chatgpt_plugin.py \
            --version "0.1.${{ github.run_number }}"

      - name: Verify archive entries
        run: |
          unzip -t build/chatgpt-plugin/pyloros-chatgpt-plugin.zip
          test "$(unzip -Z1 build/chatgpt-plugin/pyloros-chatgpt-plugin.zip | sort | tr '\n' ' ')" = "mcp.json plugin.json "

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyloros-chatgpt-plugin
          path: build/chatgpt-plugin/pyloros-chatgpt-plugin.zip
          if-no-files-found: error

  publish-plugin:
    name: Publish rolling plugin ZIP
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: pyloros-chatgpt-plugin
          path: build/chatgpt-plugin

      - name: Publish to main-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # No --prerelease here: main-latest is a regular release, and recreating it
          # as a prerelease would silently undo that whenever this workflow wins the
          # race against the jar build.
          if ! gh release view main-latest > /dev/null 2>&1; then
            gh release create main-latest \
              --title "Latest main build" \
              --notes "Automatically built packages from the main branch." \
              --latest \
              --target "$GITHUB_SHA" \
              || gh release view main-latest > /dev/null
          fi
          gh release upload main-latest \
            build/chatgpt-plugin/pyloros-chatgpt-plugin.zip --clobber
