name: Build Runnable Jar

on:
  push:
    branches:
      - main
      - feature/central-oauth-backend

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pyloros consumes com.aresstack:anauthentia(+/-jwt) 0.1.0-SNAPSHOT from
      # mavenLocal until the library's first Maven Central release. CI builds
      # the pinned library commit and publishes it locally first.
      - name: Check out AnAuthentia (pinned)
        uses: actions/checkout@v4
        with:
          repository: aresstack/anauthentia
          ref: a9c4a80b6f30f38f6594c5a3fedbdfa047e27492
          path: anauthentia

      - name: Publish AnAuthentia to mavenLocal
        run: |
          cd anauthentia
          chmod +x gradlew
          ./gradlew --no-daemon publishToMavenLocal

      - name: Build executable Pyloros jar
        run: |
          ./gradlew \
            --no-daemon \
            clean \
            :pyloros-app:shadowJar

      - name: Verify executable jar manifest and dependencies
        run: |
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/aresstack/pyloros/PylorosApplication.class$'
          unzip -p pyloros-app/build/libs/pyloros.jar META-INF/MANIFEST.MF | grep '^Main-Class: com.aresstack.pyloros.PylorosApplication'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^io/vertx/core/Vertx.class$'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/fasterxml/jackson/databind/ObjectMapper.class$'

      - name: Prepare jar artifact
        run: |
          mkdir -p build/release
          cp pyloros-app/build/libs/pyloros.jar build/release/pyloros.jar
          ls -lh build/release/pyloros.jar

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: pyloros.jar
          path: build/release/pyloros.jar
          if-no-files-found: error

      - name: Publish latest main jar to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view main-latest >/dev/null 2>&1 || \
            gh release create main-latest \
              --title "Latest main build" \
              --notes "Automated runnable jar built from the latest main branch push." \
              --prerelease \
              --target "$GITHUB_SHA"
          gh release upload main-latest build/release/pyloros.jar --clobber
