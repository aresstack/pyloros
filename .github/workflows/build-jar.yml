name: Build Runnable Jar

on:
  push:
    branches:
      - main
  # Lets a branch be built into a runnable jar without merging it first.
  workflow_dispatch:

concurrency:
  group: runnable-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build executable Pyloros jar
        run: |
          ./gradlew \
            --no-daemon \
            clean \
            :pyloros-app:shadowJar

      - name: Verify executable jar manifest and dependencies
        run: |
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/aresstack/pyloros/PylorosApplication.class$'
          unzip -p pyloros-app/build/libs/pyloros.jar META-INF/MANIFEST.MF | grep '^Main-Class: com.aresstack.pyloros.PylorosApplication'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^io/vertx/core/Vertx.class$'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/fasterxml/jackson/databind/ObjectMapper.class$'
          # AnAuthentia is consumed from Maven Central; fail if it is missing.
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/aresstack/anauthentia/'

      - name: Prepare jar artifact
        run: |
          mkdir -p build/release
          cp pyloros-app/build/libs/pyloros.jar build/release/pyloros.jar
          ls -lh build/release/pyloros.jar

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: pyloros.jar
          path: build/release/pyloros.jar
          if-no-files-found: error

      # Only the current main commit may publish its jar to the rolling release.
      - name: Publish latest main jar to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping superseded build $GITHUB_SHA; main points to $latest_main_sha"
            exit 0
          fi

          if ! gh release view main-latest >/dev/null 2>&1; then
            gh release create main-latest \
              --title "Latest main build" \
              --notes "Runnable jar built from the latest main commit." \
              --target "$GITHUB_SHA"
          fi

          gh release upload main-latest build/release/pyloros.jar --clobber

          # The release's targetCommitish alone does not move an existing tag.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/main-latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null

          {
            printf 'Runnable jar built from the latest main commit.\n\n'
            printf 'Branch: main\n'
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'SHA256: %s\n' "$(sha256sum build/release/pyloros.jar | cut -d ' ' -f 1)"
          } > build/release/release-notes.md

          gh release edit main-latest \
            --title "Latest main build" \
            --notes-file build/release/release-notes.md \
            --target "$GITHUB_SHA" \
            --latest

          published_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/main-latest" --jq '.object.sha')"
          test "$published_sha" = "$GITHUB_SHA"
          published_digest="$(gh release view main-latest --json assets --jq '.assets[] | select(.name == "pyloros.jar") | .digest')"
          test "$published_digest" = "sha256:$(sha256sum build/release/pyloros.jar | cut -d ' ' -f 1)"
