name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, e.g. 0.1.0'
        required: true
        type: string

jobs:
  build-release-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable Pyloros jar
        run: |
          ./gradlew \
            -Pversion=${{ steps.version.outputs.value }} \
            --no-daemon \
            clean \
            :pyloros-app:shadowJar

      - name: Verify executable jar manifest and dependencies
        run: |
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/aresstack/pyloros/PylorosApplication.class$'
          unzip -p pyloros-app/build/libs/pyloros.jar META-INF/MANIFEST.MF | grep '^Main-Class: com.aresstack.pyloros.PylorosApplication'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^io/vertx/core/Vertx.class$'
          jar tf pyloros-app/build/libs/pyloros.jar | grep '^com/fasterxml/jackson/databind/ObjectMapper.class$'

      - name: Prepare release asset
        run: |
          mkdir -p build/release
          cp pyloros-app/build/libs/pyloros.jar "build/release/pyloros-${{ steps.version.outputs.value }}.jar"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyloros-${{ steps.version.outputs.value }}-jar
          path: build/release/pyloros-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: build/release/pyloros-${{ steps.version.outputs.value }}.jar
