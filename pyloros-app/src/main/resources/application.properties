server.port=8081
# Loopback by default: the AresStack webserver proxies public traffic here.
# Set SERVER_HOST=0.0.0.0 only for setups without the reverse proxy.
server.host=127.0.0.1
public.origin=https://current-car.com
target.platform.modules=intellij

# Authentication: 'central-oauth' validates JWTs issued by the AresStack
# webserver (set oauth.central-issuer / CENTRAL_OAUTH_ISSUER to this
# service's public origin). 'none' disables authentication entirely.
security.mode=central-oauth
oauth.central-issuer=https://current-car.com
# Environment variables override these values when present.
